<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lumii">
  <title>lumii full wordmark</title>
  <defs>
    <linearGradient id="word-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17212D"/>
      <stop offset="48%" stop-color="#17212D"/>
      <stop offset="66%" stop-color="#F4B6A6"/>
      <stop offset="82%" stop-color="#10B9A7"/>
      <stop offset="100%" stop-color="#5F7CE6"/>
    </linearGradient>
    <linearGradient id="underline-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4B6A6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F4B6A6" stop-opacity="0.56"/>
      <stop offset="72%" stop-color="#10B9A7" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#5F7CE6" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="warm-shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#F4B6A6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#warm-shadow)">
    <text x="146" y="150"
          font-family="'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif"
          font-size="132"
          font-weight="700"
          letter-spacing="0"
          fill="url(#word-gradient)">lumii</text>
  </g>
  <rect x="452" y="176" width="104" height="7" rx="3.5" fill="url(#underline-gradient)"/>
</svg>
