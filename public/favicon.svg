<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumii">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C2A6"/>
      <stop offset="1" stop-color="#009E63"/>
    </linearGradient>
  </defs>
  <!-- green rounded-square field (the "green logo" mark) -->
  <rect width="64" height="64" rx="15" fill="url(#field)"/>
  <!-- the lowercase "ii" signature: white stems + gold dots (the "gold" accent) -->
  <g fill="#FFFDF8">
    <rect x="21.5" y="28" width="7" height="20" rx="3.5"/>
    <rect x="35.5" y="28" width="7" height="20" rx="3.5"/>
  </g>
  <g fill="#F2C766">
    <circle cx="25" cy="20.5" r="4.1"/>
    <circle cx="39" cy="20.5" r="4.1"/>
  </g>
</svg>
