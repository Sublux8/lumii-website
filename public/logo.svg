<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" role="img" aria-label="Lumii">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C2A6"/>
      <stop offset="1" stop-color="#009E63"/>
    </linearGradient>
  </defs>
  <!-- green app mark -->
  <rect width="64" height="64" rx="15" fill="url(#mark)"/>
  <g fill="#FFFDF8">
    <rect x="21.5" y="28" width="7" height="20" rx="3.5"/>
    <rect x="35.5" y="28" width="7" height="20" rx="3.5"/>
  </g>
  <g fill="#F2C766">
    <circle cx="25" cy="20.5" r="4.1"/>
    <circle cx="39" cy="20.5" r="4.1"/>
  </g>
  <!-- wordmark: dark ink with teal "ii" (matches the site wordmark) -->
  <text x="82" y="44"
    font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="42" font-weight="700" letter-spacing="-1.2">
    <tspan fill="#10202C">lum</tspan><tspan fill="#00A895">ii</tspan>
  </text>
</svg>
