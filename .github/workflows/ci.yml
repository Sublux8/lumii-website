name: CI

# §19 pipeline. Two tiers:
#  - `quality` (REQUIRED, blocks merge): deterministic gates — format, lint,
#    typecheck, build, broken-link check. This is the check branch protection
#    requires on `main`.
#  - `audits` (informational, never blocks): Lighthouse budgets + axe a11y. They
#    need Chrome/chromedriver and stable page scores, which aren't reliable
#    merge-gates for a pre-content skeleton — they run and report, tracked to be
#    promoted to hard gates once real pages land. `main` is protected; Sveltia
#    writes only to `drafts`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Broken-link / image check
        run: npm run links

  audits:
    name: Audits (informational)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI (perf budgets + a11y/seo)
        continue-on-error: true
        run: npm run lhci

      - name: axe accessibility pass
        continue-on-error: true
        run: npm run a11y
